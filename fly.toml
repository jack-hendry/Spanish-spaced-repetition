app = "spanish-srs"
primary_region = "yyz"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data/spanish"
  TZ = "America/Toronto"
  PORT = "3000"

[[mounts]]
  source = "spanish_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
