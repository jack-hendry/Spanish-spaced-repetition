repos:
  - repo: local
    hooks:
      - id: clean-table-check
        name: clean table check (archive gate + summary gate)
        entry: scripts/clean-table-check.sh
        language: script
        pass_filenames: false
        stages: [pre-push]
      - id: format-check
        name: prettier format check
        entry: npm run format:check --silent
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: eslint-check
        name: eslint check (npm run lint:ci)
        entry: npm run lint:ci --silent
        language: system
        pass_filenames: false
        stages: [pre-push]