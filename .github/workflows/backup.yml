# Backup scheduling state from Fly.io and push to git history.
# See specs/BACKUP-RUNBOOK.md for operational runbook and incident procedures.

name: Backup

on:
  schedule:
    # Every 6 hours at UTC 00/06/12/18 = Toronto 20:00/02:00/08:00/14:00 (offset -4/-5)
    # GitHub cron is best-effort and can run late under load; this is a ceiling on
    # scheduling frequency, not a guarantee of punctuality.
    #
    # This interval IS the retention policy's loss figure: a total Fly loss costs
    # at most ~6h of reviews. Changing it changes the documented window, so change
    # specs/STATE.md AD-027 and ROADMAP.md Phase 2 with it.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5

      - name: Expose flyctl as `fly`
        run: |
          # The flyctl release tarball ships only `flyctl`; Homebrew and the
          # official installer add the `fly` symlink, setup-flyctl does not.
          # tools/*-fly-state.sh and the steps below all invoke `fly`.
          FLYCTL=$(command -v flyctl) || {
            echo "::error::setup-flyctl did not put flyctl on PATH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/fly-shim"
          ln -sf "$FLYCTL" "$RUNNER_TEMP/fly-shim/fly"
          echo "$RUNNER_TEMP/fly-shim" >> "$GITHUB_PATH"

      - name: Wake production machine
        run: |
          # fly.toml: auto_start_machines = true, min_machines_running = 0, so an
          # HTTP request wakes the machine. /api/health is the one anonymous
          # route (server/src/app.ts). This approach avoids CLI commands that
          # need a machine lease the CI token deliberately does not have.
          # Fly holds the request while the machine boots, so a 200 means it is
          # serving. Retries cover a cold-start timeout, not a failing app: if
          # every attempt fails the step still exits non-zero.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 90 https://spanish-srs.fly.dev/api/health

      - name: Pull scheduling state from Fly
        run: bash tools/pull-fly-state.sh

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- data/spanish/)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Backup Bot"
          git config user.email "noreply@github.com"
          git add data/spanish/
          git commit -m "Automated backup from Fly.io"
          git push

