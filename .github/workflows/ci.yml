name: CI

# Defense in depth. The clean-table check already runs as a local pre-push hook
# (.pre-commit-config.yaml), but a local hook can be skipped with
# `git push --no-verify`. CI runs the same script, and CI cannot be skipped.

on:
  push:
    branches: [main]
    # Skip CI for pushes that change ONLY the live scheduling store.
    #
    # NOT for the backup workflow's commits: those push with the default
    # GITHUB_TOKEN, and GitHub refuses to start a run from such a push
    # (its recursion guard). They already cost nothing, so "nightly bot
    # commits burn CI minutes" was never true -- do not cite it as the reason.
    #
    # The real case is a HUMAN pushing data only. Measured over this repo's
    # history: 24 commits touch data/spanish/ on main; 6 triggered a push run,
    # and 3 of those changed data/spanish/ EXCLUSIVELY (66d32cb, 7e6b5cf,
    # 81ff9f4) -- two npm ci installs each for a pure-JSON change. The other 3
    # also touched code and must still run, which paths-ignore honours: it
    # skips only when every changed path matches.
    #
    # push only. A pull_request that changes data is still checked.
    paths-ignore: ['data/spanish/**']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Root `test` runs both workspaces in order: server (vitest) then web
      # (@angular/build:unit-test, vitest under the hood). Neither needs a real
      # browser, so there is no Chrome step here.
      - run: npm run test
      # The web workspace's tests build the app first, but the server's tsc
      # build is not exercised by vitest -- which transpiles test files without
      # type-checking them. A type error can therefore live in a *.test.ts and
      # keep the suite green while the build is red (L-003).
      - run: npm run build

  clean-table-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script needs git history to compute the diff range
      - run: bash scripts/clean-table-check.sh
        env:
          # github.event.before is only set on push events; the script ignores
          # it on pull_request and uses GITHUB_BASE_REF instead.
          BEFORE_SHA: ${{ github.event.before }}

  lint:
    # Ruff and ESLint linting gates. Ruff is scoped to tools/state_rotate.py —
    # see the SCOPE comment in ruff.toml for why the content pipeline
    # (scrape.py, tools/convert_apkg.py) is not linted yet. ESLint's `lint:ci`
    # now gates the whole repo (`eslint .`) — Phases 1–4 of
    # specs/015-typescript-lint-rollout/ROADMAP.md are complete.
    # TypeScript formatting is checked in the `tests` job (`npm run format:check`, Prettier).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter turns a new ruff release into a red build on
      # a commit that changed nothing. Bump it deliberately.
      - run: pip install ruff==0.16.4
      - run: ruff check .
      - run: ruff format --check tools/state_rotate.py
      - run: npm run lint:ci

  hooks:
    # The delegation hook is a regex heuristic over shell command strings. A
    # tightened pattern that starts blocking `npx ng test` makes every tasks.md
    # run unusable; a loosened one silently re-opens the gap the hook exists to
    # close. Neither shows up in any other job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./.claude/hooks/enforce-haiku-tasks.test.sh
      # Gate 5 of the clean-table check is the only gate that reads inside a
      # file rather than judging it by path and size, so its regressions are
      # invisible to clean-table-gate, which only ever runs the script against
      # this repo's own already-compliant history.
      - run: ./scripts/clean-table-check.test.sh
      # archive_spec.py moves and deletes spec content. Its quiet failure modes
      # -- a dry run that writes, a prune that takes an unnamed section, a file
      # reported clean while still over the push gate's 20 KB cap -- surface
      # only as a refused push or a silently half-gone spec.
      - run: ./tools/archive_spec.test.sh
      # These scripts run by hand on macOS bash 3.2, but the backup workflow runs
      # them on ubuntu-latest's bash 5. The bash 5 fixes (Step 1's local removal,
      # Step 2's post-increment replacement) are not testable locally and only
      # surface as failures on CI.
      - run: ./tools/state-scripts.bash5.test.sh
