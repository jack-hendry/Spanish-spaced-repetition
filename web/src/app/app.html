<div class="app-shell">
  <aside class="app-sidebar">
    <a routerLink="/" class="brand">{{ title }}</a>

    <nav class="app-nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path
            d="M10 2 2 6l8 4 8-4-8-4Z M2 10l8 4 8-4 M2 14l8 4 8-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Decks</span>
      </a>
      <a routerLink="/browse" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5" />
          <path
            d="m17 17-4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <span>Browse</span>
      </a>
      <a routerLink="/stats" routerLinkActive="active" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path
            d="M3 17V3 M3 17h14 M7 17v-6 M11 17V7 M15 17v-9"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Stats</span>
      </a>
    </nav>
  </aside>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
